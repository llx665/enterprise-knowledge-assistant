<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问答 - 企业知识库</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">🏢 企业知识库</a>
  <ul class="navbar-nav">
    <li><a href="/">首页</a></li>
    <li><a href="/static/chat.html" class="active">问答</a></li>
    <li><a href="/static/upload.html">上传文档</a></li>
    <li><a href="/static/knowledge.html">知识库</a></li>
    <li><a href="/static/logs.html">日志统计</a></li>
  </ul>
  <div class="navbar-right">
    <button class="btn btn-outline btn-sm" onclick="clearChat()">清空对话</button>
  </div>
</nav>

<div class="container chat-container">
  <div class="card" style="flex:1;display:flex;flex-direction:column;padding:0;">
    <div class="chat-messages" id="chatMessages">
      <div class="message message-assistant">
        您好！我是企业智能知识库助手。请上传文档后，向我提问相关问题。
      </div>
    </div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" rows="2" placeholder="请输入您的问题..." onkeydown="handleKeyDown(event)"></textarea>
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + type;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

let isStreaming = false;
let abortController = null;
let sessionId = 'session_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

function handleKeyDown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addMessage(role, content, citations) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message message-' + role;

  const textDiv = document.createElement('div');
  textDiv.textContent = content;
  div.appendChild(textDiv);

  if (citations && citations.length > 0) {
    citations.forEach(c => {
      const cite = document.createElement('div');
      cite.className = 'citation';
      cite.innerHTML = '<strong>来源:</strong> ' + c.filename +
        (c.page_number ? ' (第' + c.page_number + '页)' : '') +
        '<br><small>' + c.content.slice(0, 150) + '...</small>';
      div.appendChild(cite);
    });
  }

  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

function addAssistantMessage() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message message-assistant';
  const textDiv = document.createElement('div');
  textDiv.id = 'assistantText';
  div.appendChild(textDiv);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const query = input.value.trim();
  if (!query || isStreaming) return;

  input.value = '';
  addMessage('user', query);
  addAssistantMessage();

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;
  isStreaming = true;

  const token = localStorage.getItem('token') || '';
  const headers = {'Content-Type': 'application/json'};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  headers['X-Session-ID'] = sessionId;

  try {
    const resp = await fetch('/api/chat/ask', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({query, session_id: sessionId, top_k: 5}),
    });

    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let answerText = document.getElementById('assistantText');
    let fullAnswer = '';
    let citations = [];

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          switch (data.event) {
            case 'token':
              fullAnswer += data.content;
              answerText.textContent = fullAnswer;
              break;
            case 'citation':
              citations = data.citations || [];
              break;
            case 'status':
              answerText.textContent = data.message;
              break;
            case 'error':
              answerText.textContent = '错误: ' + data.message;
              showToast(data.message, 'error');
              break;
          }
          document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
        } catch(e) {}
      }
    }

    // 添加引用来源
    if (citations.length > 0) {
      const lastMsg = document.querySelector('.message-assistant:last-child');
      citations.forEach(c => {
        const cite = document.createElement('div');
        cite.className = 'citation';
        cite.innerHTML = '<strong>来源:</strong> ' + c.filename +
          (c.page_number ? ' (第' + c.page_number + '页)' : '') +
          '<br><small>' + (c.content || '').slice(0, 200) + '</small>';
        lastMsg.appendChild(cite);
      });
    }

  } catch(e) {
    showToast('请求失败: ' + e.message, 'error');
    const text = document.getElementById('assistantText');
    if (text) text.textContent = '抱歉，回答过程中出现错误: ' + e.message;
  } finally {
    sendBtn.disabled = false;
    isStreaming = false;
  }
}

function clearChat() {
  document.getElementById('chatMessages').innerHTML = '<div class="message message-assistant">对话已清空，可以开始新对话。</div>';
  sessionId = 'session_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
</script>
</body>
</html>
