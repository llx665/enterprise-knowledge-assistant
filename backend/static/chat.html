<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问答 - 企业知识库</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
/* ===== 聊天布局 ===== */
.chat-page { display: flex; height: calc(100vh - 56px); }
.chat-sidebar {
  width: 280px; min-width: 280px; background: #f8f9fa;
  border-right: 1px solid #e8e8e8; display: flex; flex-direction: column;
}
.chat-sidebar-header { padding: 16px; border-bottom: 1px solid #e8e8e8; }
.chat-sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
.conv-item {
  display: flex; flex-direction: column; padding: 12px; cursor: pointer;
  border-radius: 8px; margin-bottom: 4px; transition: background 0.2s;
}
.conv-item:hover { background: #e9ecef; }
.conv-item.active { background: #d0ebff; }
.conv-title { font-size: 14px; font-weight: 500; color: #1f1f1f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-meta { font-size: 11px; color: #999; margin-top: 4px; }
.chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.chat-header {
  padding: 12px 20px; border-bottom: 1px solid #e8e8e8;
  display: flex; align-items: center; justify-content: space-between;
  background: #fff;
}
.chat-header-title { font-size: 15px; font-weight: 600; }
.chat-messages-area {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
  background: #f0f2f5;
}
.chat-input-area {
  display: flex; gap: 8px; padding: 12px 20px; background: #fff;
  border-top: 1px solid #e8e8e8;
}
.chat-input { flex: 1; border: none; outline: none; font-size: 14px; padding: 8px 0; resize: none; }
/* ===== 聊天气泡 ===== */
.msg-row { display: flex; gap: 8px; max-width: 80%; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.assistant { align-self: flex-start; }
.msg-avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff;
}
.msg-avatar.user-av { background: #1677ff; }
.msg-avatar.asst-av { background: #52c41a; }
.msg-bubble {
  padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6;
  word-break: break-word; position: relative;
}
.msg-row.user .msg-bubble {
  background: #1677ff; color: #fff;
  border-bottom-right-radius: 4px;
}
.msg-row.assistant .msg-bubble {
  background: #fff; color: #1f1f1f;
  border-bottom-left-radius: 4px; border: 1px solid #e8e8e8;
}
.msg-citation {
  margin-top: 8px; padding: 8px 10px; background: #f0f5ff;
  border-left: 3px solid #1677ff; border-radius: 6px; font-size: 12px;
  color: #666; line-height: 1.4;
}
.msg-citation strong { color: #1677ff; }
.msg-time { font-size: 11px; color: #bbb; text-align: center; margin-top: 4px; }
/* ===== 空状态 ===== */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; color: #bbb; gap: 12px;
}
.empty-icon { font-size: 64px; }
.empty-text { font-size: 16px; }
.empty-hint { font-size: 13px; }
/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .chat-sidebar { width: 60px; min-width: 60px; }
  .chat-sidebar .conv-title,
  .chat-sidebar .conv-meta,
  .chat-sidebar .chat-sidebar-header .btn span { display: none; }
  .msg-row { max-width: 90%; }
}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand">🏢 企业知识库</a>
  <ul class="navbar-nav">
    <li><a href="/">首页</a></li>
    <li><a href="/static/chat.html" class="active">问答</a></li>
    <li><a href="/static/upload.html">上传文档</a></li>
    <li><a href="/static/knowledge.html">知识库</a></li>
    <li><a href="/static/logs.html">日志统计</a></li>
  </ul>
  <div class="navbar-right" id="userInfo"></div>
</nav>

<div class="chat-page">
  <!-- 左侧：对话列表 -->
  <div class="chat-sidebar">
    <div class="chat-sidebar-header">
      <button class="btn btn-primary" onclick="newConversation()" style="width:100%;">
        <span>＋ 新建对话</span>
      </button>
    </div>
    <div class="chat-sidebar-list" id="convList"></div>
  </div>

  <!-- 右侧：聊天区 -->
  <div class="chat-main">
    <div class="chat-header">
      <span class="chat-header-title" id="chatTitle">对话</span>
      <button class="btn btn-danger btn-sm" onclick="deleteCurrentConv()" title="删除当前对话">🗑️</button>
    </div>
    <div class="chat-messages-area" id="chatMessages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">💬</div>
        <div class="empty-text">企业智能知识库助手</div>
        <div class="empty-hint">选择左侧对话，或点击「新建对话」开始提问</div>
      </div>
    </div>
    <div class="chat-input-area">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="输入问题，按 Enter 发送…" onkeydown="handleKey(event)"></textarea>
      <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ===== 数据管理 =====
let conversations = [];        // {id, title, ts} 存储在 localStorage
let currentConvId = null;     // 当前对话 ID
let isStreaming = false;
let abortController = null;

const LS_KEY = "kb_chat_convs";
const MAX_CONVS = 50;
const MSG_TYPES = { user: "user", assistant: "assistant" };

function loadConvs() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    conversations = raw ? JSON.parse(raw) : [];
  } catch(e) { conversations = []; }
}

function saveConvs() {
  localStorage.setItem(LS_KEY, JSON.stringify(conversations));
}

function getConv(id) { return conversations.find(c => c.id === id); }

function addConv(id, title) {
  if (getConv(id)) return;
  conversations.unshift({ id, title: title || "新对话", ts: Date.now() });
  if (conversations.length > MAX_CONVS) conversations.pop();
  saveConvs();
}

function updateConvTitle(id, title) {
  const c = getConv(id);
  if (c && c.title === "新对话") { c.title = title; saveConvs(); }
}

function removeConv(id) {
  conversations = conversations.filter(c => c.id !== id);
  saveConvs();
}

function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast toast-" + type;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 3000);
}

// ===== 对话列表渲染 =====
function renderConvList() {
  const el = document.getElementById("convList");
  if (conversations.length === 0) {
    el.innerHTML = '<div style="text-align:center;color:#bbb;font-size:13px;padding:20px;">暂无对话</div>';
    return;
  }
  el.innerHTML = conversations.map(c =>
    `<div class="conv-item${c.id === currentConvId ? ' active' : ''}" onclick="switchConv('${c.id}')">
       <div class="conv-title">${escapeHtml(c.title)}</div>
       <div class="conv-meta">${formatTime(c.ts)}</div>
     </div>`
  ).join('');
}

function escapeHtml(t) { return (t||'').replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];}); }
function formatTime(ts) { const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }

// ===== 对话管理 =====
function newConversation() {
  const id = "session_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  addConv(id, "新对话");
  switchConv(id);
}

function switchConv(id) {
  currentConvId = id;
  renderConvList();
  document.getElementById("chatTitle").textContent = getConv(id)?.title || "对话";
  loadHistory(id);
}

function deleteCurrentConv() {
  if (!currentConvId) return;
  if (!confirm("确定删除当前对话？")) return;
  removeConv(currentConvId);
  currentConvId = null;
  document.getElementById("chatTitle").textContent = "对话";
  document.getElementById("chatMessages").innerHTML = getEmptyStateHTML();
  renderConvList();
}

function getEmptyStateHTML() {
  return `<div class="empty-state" id="emptyState">
    <div class="empty-icon">💬</div>
    <div class="empty-text">企业智能知识库助手</div>
    <div class="empty-hint">选择左侧对话，或点击「新建对话」开始提问</div>
  </div>`;
}

// ===== 消息历史 =====
async function loadHistory(sessionId) {
  const container = document.getElementById("chatMessages");
  container.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">加载中…</div>';
  try {
    const token = localStorage.getItem("token") || "";
    const h = {"Content-Type":"application/x-www-form-urlencoded"};
    if (token) h["Authorization"] = "Bearer " + token;
    const r = await fetch("/api/chat/history", {
      method: "POST",
      headers: h,
      body: "session_id=" + encodeURIComponent(sessionId)
    });
    const d = await r.json();
    if (d.code === 200 && d.data && d.data.length > 0) {
      container.innerHTML = "";
      d.data.forEach(msg => {
        if (msg.role === "user") renderMessage(msg.content, MSG_TYPES.user);
        else renderMessage(msg.content, MSG_TYPES.assistant);
      });
    } else {
      container.innerHTML = getEmptyStateHTML();
    }
  } catch(e) {
    container.innerHTML = getEmptyStateHTML();
  }
  scrollToBottom();
}

// ===== 渲染消息 =====
function renderMessage(content, role, citations) {
  const container = document.getElementById("chatMessages");
  // 移除空状态
  const empty = document.getElementById("emptyState");
  if (empty) empty.remove();

  const row = document.createElement("div");
  row.className = "msg-row " + role;

  const avatar = document.createElement("div");
  avatar.className = "msg-avatar " + (role === "user" ? "user-av" : "asst-av");
  avatar.textContent = role === "user" ? "我" : "AI";

  const bubbleWrap = document.createElement("div");
  bubbleWrap.style.cssText = "display:flex;flex-direction:column;gap:4px;";

  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.id = role === "assistant" ? "streamingBubble" : "";
  bubble.textContent = content;

  bubbleWrap.appendChild(bubble);

  // 引用来源
  if (citations && citations.length > 0) {
    citations.forEach(c => {
      const cite = document.createElement("div");
      cite.className = "msg-citation";
      cite.innerHTML = `<strong>📄 ${escapeHtml(c.filename)}</strong>` +
        (c.page_number ? ` (第${c.page_number}页)` : "") +
        (c.paragraph_number ? ` 段落${c.paragraph_number}` : "") +
        `<br><small>${escapeHtml((c.content||"").slice(0,120))}…</small>`;
      bubbleWrap.appendChild(cite);
    });
  }

  row.appendChild(avatar);
  row.appendChild(bubbleWrap);
  container.appendChild(row);
  scrollToBottom();
  return bubble;
}

function scrollToBottom() {
  const area = document.getElementById("chatMessages");
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 50);
}

// ===== 发送消息 =====
function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  const input = document.getElementById("chatInput");
  const query = input.value.trim();
  if (!query || isStreaming) return;

  // 没有对话则创建
  if (!currentConvId) newConversation();
  const sessionId = currentConvId;

  // 更新对话标题
  updateConvTitle(sessionId, query.slice(0, 20) + (query.length > 20 ? "…" : ""));
  document.getElementById("chatTitle").textContent = getConv(sessionId)?.title || "对话";
  renderConvList();

  input.value = "";
  input.style.height = "auto";

  // 显示用户消息
  renderMessage(query, MSG_TYPES.user);

  const sendBtn = document.getElementById("sendBtn");
  sendBtn.disabled = true;
  isStreaming = true;

  // 创建助手气泡（等待流式填充）
  const container = document.getElementById("chatMessages");
  const row = document.createElement("div");
  row.className = "msg-row assistant";
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar asst-av";
  avatar.textContent = "AI";
  const bubbleWrap = document.createElement("div");
  bubbleWrap.style.cssText = "display:flex;flex-direction:column;gap:4px;";
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  bubble.id = "streamingBubble";
  bubble.textContent = "思考中…";
  const loading = document.createElement("span");
  loading.id = "loadingDots";
  loading.textContent = "";
  bubble.appendChild(loading);
  bubbleWrap.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(bubbleWrap);
  container.appendChild(row);
  scrollToBottom();

  // 引用容器
  const citeContainer = document.createElement("div");
  citeContainer.id = "citeContainer";
  bubbleWrap.appendChild(citeContainer);

  const token = localStorage.getItem("token") || "";
  const headers = {"Content-Type":"application/json"};
  if (token) headers["Authorization"] = "Bearer " + token;
  headers["X-Session-ID"] = sessionId;

  let fullAnswer = "";
  let citations = [];

  try {
    const resp = await fetch("/api/chat/ask", {
      method: "POST",
      headers: headers,
      body: JSON.stringify({query, session_id: sessionId, top_k: 5}),
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    // 移除思考中
    const loadingEl = document.getElementById("loadingDots");
    if (loadingEl) loadingEl.remove();

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        try {
          const data = JSON.parse(line.slice(6));
          switch (data.event) {
            case "token":
              fullAnswer += data.content;
              document.getElementById("streamingBubble").textContent = fullAnswer;
              break;
            case "citation":
              citations = data.citations || [];
              break;
            case "status":
              if (!fullAnswer) {
                document.getElementById("streamingBubble").textContent = data.message;
              }
              break;
            case "error":
              document.getElementById("streamingBubble").textContent = "⚠️ " + data.message;
              break;
          }
          scrollToBottom();
        } catch(e) {}
      }
    }
    // 显示引用
    if (citations.length > 0) {
      citeContainer.innerHTML = "";
      citations.forEach(c => {
        const cite = document.createElement("div");
        cite.className = "msg-citation";
        cite.innerHTML = `<strong>📄 ${escapeHtml(c.filename)}</strong>` +
          (c.page_number ? ` (第${c.page_number}页)` : "") +
          (c.paragraph_number ? ` 段落${c.paragraph_number}` : "") +
          `<br><small>${escapeHtml((c.content||"").slice(0,200))}</small>`;
        citeContainer.appendChild(cite);
      });
    }
  } catch(e) {
    document.getElementById("streamingBubble").textContent = "⚠️ 请求失败: " + e.message;
  } finally {
    sendBtn.disabled = false;
    isStreaming = false;
    // 清除 ID 防止冲突
    const sb = document.getElementById("streamingBubble");
    if (sb) sb.removeAttribute("id");
    scrollToBottom();
  }
}

// ===== 初始化 =====
(function() {
  loadConvs();
  if (conversations.length > 0) {
    switchConv(conversations[0].id);
  } else {
    renderConvList();
  }
  // 自动调整输入框高度
  const inp = document.getElementById("chatInput");
  inp.addEventListener("input", () => {
    inp.style.height = "auto";
    inp.style.height = Math.min(inp.scrollHeight, 120) + "px";
  });
  // 自动聚焦
  inp.focus();
})();
</script>
</body>
</html>
